name: dreamideaura
description: Local-first crochet business investment, product and profit sharing manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app_logo.jpg

  android: true
  ios: true
  web: false

  android_12:
    color: "#FFFFFF"
    image: assets/images/app_logo.jpg
    icon_background_color: "#FFFFFF"